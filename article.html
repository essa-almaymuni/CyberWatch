<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سايبر ووتش | تفاصيل الخبر</title>
  <meta name="description" content="تفاصيل الخبر الأمني" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="noise-overlay" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-group">
        <a href="index.html" class="logo-back" aria-label="العودة للرئيسية">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="index.html" class="logo-main-link">
          <div class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="20,2 38,11 38,29 20,38 2,29 2,11" stroke="currentColor" stroke-width="1.5" fill="none"/>
              <polygon points="20,8 32,14 32,26 20,32 8,26 8,14" stroke="currentColor" stroke-width="1" fill="none" opacity="0.5"/>
              <circle cx="20" cy="20" r="4" fill="currentColor"/>
              <line x1="20" y1="8" x2="20" y2="16" stroke="currentColor" stroke-width="1"/>
              <line x1="20" y1="24" x2="20" y2="32" stroke="currentColor" stroke-width="1"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-main">سايبر ووتش</span>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="article-main" id="articleMain">

    <div class="article-loading" id="articleLoading">
      <div class="skeleton-featured"></div>
    </div>

    <article class="article-container hidden" id="articleContainer">
      <!-- filled by article.js -->
    </article>

    <div class="error-state hidden" id="articleError" role="alert">
      <div class="error-icon" aria-hidden="true">✕</div>
      <p id="errorMsg">تعذّر تحميل الخبر</p>
      <a href="index.html" class="retry-btn">العودة للرئيسية</a>
    </div>

  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">سايبر ووتش</span>
        <p>منصة آلية لرصد وتحليل أخبار الأمن السيبراني العالمية · يتجدد تلقائياً</p>
      </div>
      <div class="footer-sources">
        <span class="footer-label">المصادر:</span>
        <span>The Hacker News · BleepingComputer · Krebs on Security · Dark Reading · SecurityWeek</span>
      </div>
    </div>
  </footer>

  <script src="js/article.js"></script>
</body>
</html>
